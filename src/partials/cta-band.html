<section class="cta-band on-dark">
  <div class="container cta-band__inner">
    <div>
      <h2>{{heading}}</h2>
      <p>{{text}}</p>
    </div>
    <div class="actions">
      <a class="btn btn--light" href="{{primaryHref}}">{{primary}}</a>
      {{#if secondary}}<a class="btn btn--ghost" href="{{secondaryHref}}">{{secondary}}</a>{{/if}}
    </div>
  </div>
</section>
