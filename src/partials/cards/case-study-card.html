<article class="card card--link project-card">
  <div class="project-card__media">
    <img src="/assets/img/portfolio/{{item.image}}-desktop-720.webp" width="720" height="450" alt="{{item.imageAlt}}" loading="lazy" decoding="async">
  </div>
  <div class="project-card__body">
    <span class="post-card__cat">Case study</span>
    <h3><a class="card__link" href="{{item.route}}">{{item.breadcrumb}}</a></h3>
    <p>{{item.challenge}}</p>
    <span class="card__more">Read the case study</span>
  </div>
</article>
