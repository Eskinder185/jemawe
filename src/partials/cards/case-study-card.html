<article class="card project-card">
  <a class="project-card__media shot-link" data-screenshot href="/assets/img/portfolio/{{item.image}}-desktop-1440.webp" aria-label="View full-size screenshot of {{item.breadcrumb}}">
    <img src="/assets/img/portfolio/{{item.image}}-desktop-720.webp" width="720" height="450" alt="{{item.imageAlt}}" loading="lazy" decoding="async">
    <span class="shot-link__label">View screenshot</span>
  </a>
  <div class="project-card__body">
    <span class="post-card__cat">{{item.projectLabel}}</span>
    <h3><a href="{{item.route}}">{{item.breadcrumb}}</a></h3>
    <p>{{item.challenge}}</p>
    <div class="project-card__actions"><a class="text-link" href="{{item.route}}">Read case study</a>{{#if item.liveUrl}}<a class="text-link" href="{{item.liveUrl}}" rel="noopener noreferrer">Visit live site</a>{{/if}}</div>
  </div>
</article>
