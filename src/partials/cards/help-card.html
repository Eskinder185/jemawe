<article class="card card--link post-card" data-filter-item data-category="{{item.category}}">
  <span class="post-card__cat">{{item.categoryLabel}}</span>
  <h3><a class="card__link" href="{{item.route}}">{{item.title}}</a></h3>
  <p>{{item.summary}}</p>
  <p class="post-card__meta">{{item.readingTime}} min read</p>
</article>
