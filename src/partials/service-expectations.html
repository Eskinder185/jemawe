<section class="section section--soft" aria-labelledby="service-expectations">
  <div class="container">
    <div class="section-head section-head--split">
      <h2 id="service-expectations">Plan the work with clear details</h2>
      <p>Scope, timing, and any support afterward are agreed for the specific request.</p>
    </div>
    <div class="grid grid--4">
      <div class="card"><h3>Cost</h3><p>{{cost}}</p></div>
      <div class="card"><h3>Timing</h3><p>{{timing}}</p></div>
      <div class="card"><h3>What to prepare</h3><p>{{prepare}}</p></div>
      <div class="card"><h3>After the work</h3><p>{{after}}</p></div>
    </div>
  </div>
</section>
