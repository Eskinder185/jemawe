<div class="form-row form-row--2">
  <div class="field">
    <label for="{{prefix}}-name">Full name</label>
    <input id="{{prefix}}-name" name="name" type="text" autocomplete="name" required>
  </div>
  <div class="field">
    <label for="{{prefix}}-email">Email address</label>
    <input id="{{prefix}}-email" name="email" type="email" autocomplete="email" inputmode="email" required>
  </div>
</div>
<div class="form-row form-row--2">
  <div class="field">
    <label for="{{prefix}}-phone">Phone <span class="field__optional">(optional)</span></label>
    <input id="{{prefix}}-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
  </div>
  <div class="field">
    <label for="{{prefix}}-org">Company or organization <span class="field__optional">(optional)</span></label>
    <input id="{{prefix}}-org" name="organization" type="text" autocomplete="organization">
  </div>
</div>
