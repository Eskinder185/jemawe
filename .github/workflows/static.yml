name: Validate Jemawe pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test enquiry handling
        run: node --test tests/enquiries.test.mjs
      - name: Build GitHub Pages preview
        run: npm run build:pages
        env:
          BASE_PATH: /jemawe
